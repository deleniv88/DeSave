<body>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Manrope:wght@300;400;500;600;700&family=Inter+Tight:wght@500;600;700&display=swap">
<style>
/* Layout: one phone column; gradient top band with glass summary cards; payments on one continuous glass panel; round icons; floating glass tab bar.
   Tokens follow deweb.studio (bg #f0f1f6, ink #242527, accent #8791ff → #5e6cff, Urbanist / Manrope / Inter Tight). Single light theme by choice. */
:root{
  color-scheme:light;
  --bg:#F0F1F6; --ink:#242527; --ink-2:rgba(36,37,39,.64); --ink-3:rgba(36,37,39,.44); --line:rgba(36,37,39,.07);
  --glass:rgba(255,255,255,.55); --edge:rgba(255,255,255,.78); --row:rgba(255,255,255,.72);
  --a:#8791FF; --b:#5E6CFF; --tint:#E9EBFF;
  --good:#1C9466; --good-soft:#DCF3E9; --warn:#A86200; --warn-soft:#FFEFCF; --crit:#D23A3A; --crit-soft:#FCE2E2; --violet:#5E4FE0; --violet-soft:#E7E5FF;
  --f-display:"Urbanist","Helvetica Neue",Arial,sans-serif;
  --f-body:"Manrope","Helvetica Neue",Arial,sans-serif;
  --f-num:"Inter Tight","Helvetica Neue",Arial,sans-serif;
  --r-xl:28px; --r-lg:22px; --r-md:16px;
  --inset:inset 0 0 23px rgba(255,255,255,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--b);outline-offset:2px;border-radius:10px}
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(55% 32% at 8% 0%,rgba(135,145,255,.38),transparent 72%),
  radial-gradient(45% 30% at 100% 6%,rgba(150,205,255,.34),transparent 72%),
  radial-gradient(70% 34% at 90% 100%,rgba(94,108,255,.13),transparent 72%),
  linear-gradient(180deg,#FFFFFF 0%,var(--bg) 46%)}
.app{position:relative;z-index:1;max-width:460px;margin:0 auto;padding-inline:18px;padding-block:6px 128px;min-height:100%}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(150%);backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--edge);box-shadow:var(--inset)}
.label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

/* header */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 16px}
.who{display:flex;align-items:center;gap:12px;min-width:0;text-align:left;border-radius:999px}
.who>div{min-width:0}
.avatar{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:17px;color:#fff;background:linear-gradient(145deg,var(--a),var(--b))}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.who small{display:block;font-size:12.5px;color:var(--ink-3);font-weight:500}
.who b{display:block;font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-actions{display:flex;gap:8px;align-items:center;position:relative;flex:none}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.icon-btn svg{width:21px;height:21px}
.icon-btn .dot{position:absolute;top:11px;right:12px;width:8px;height:8px;border-radius:50%;background:var(--b);box-shadow:0 0 0 2px #fff}
.lang-btn{height:46px;padding:0 12px 0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px;letter-spacing:.04em}
.lang-btn svg{width:14px;height:14px}
.menu{position:absolute;top:54px;right:54px;z-index:15;min-width:168px;border-radius:18px;padding:6px;display:grid;gap:2px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);border:1px solid var(--edge);box-shadow:0 14px 36px rgba(36,37,39,.14)}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:600;text-align:left;color:var(--ink)}
.menu button[aria-checked="true"]{background:var(--tint);color:var(--b)}
.menu button small{font-size:11.5px;color:var(--ink-3);font-weight:700;letter-spacing:.06em}
.back{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.back svg{width:20px;height:20px}
.page-title{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:-.01em}

/* top band */
.top{position:relative;margin:-6px -18px 0;padding:6px 18px 26px;color:#fff;background:
  radial-gradient(70% 55% at 92% 2%,rgba(170,210,255,.6),transparent 70%),
  radial-gradient(60% 50% at 0% 30%,rgba(120,95,255,.35),transparent 70%),
  linear-gradient(180deg,#3E4CF0 0%,#5866FF 34%,#7F8AFF 62%,rgba(135,145,255,.45) 84%,rgba(240,241,246,0) 100%)}
.top .who small{color:rgba(255,255,255,.78)}
.top .who b{color:#fff}
.top .avatar{background:linear-gradient(145deg,#fff,#DCE0FF);color:var(--b);box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.top .icon-btn,.top .lang-btn{color:#fff;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.38);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 16px rgba(255,255,255,.22)}
.top .icon-btn .dot{background:#FFD36B;box-shadow:0 0 0 2px #5866FF}
.top .label{color:rgba(255,255,255,.8)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill-btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));white-space:nowrap}
.pill-btn svg{width:14px;height:14px}
.top .pill-btn{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.42);box-shadow:inset 0 0 14px rgba(255,255,255,.25)}
.amount{display:flex;align-items:baseline;gap:2px;margin:10px 0 2px}
.amount .int{font-family:var(--f-num);font-weight:700;font-size:54px;line-height:1;letter-spacing:-.035em;color:#fff}
.amount .dec{font-family:var(--f-num);font-weight:600;font-size:22px;color:rgba(255,255,255,.55)}
.top-sh{display:flex;justify-content:space-between;align-items:center;margin:20px 0 10px}
.top-sh span{font-family:var(--f-display);font-weight:600;font-size:17px}
.top-sh button{color:#fff;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px;opacity:.92}
.top-sh button svg{width:15px;height:15px}
.gcards{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:18px;margin-inline:-18px;padding:2px 18px 4px;scrollbar-width:none}
.gcards::after{content:"";flex:0 0 8px}
.gcards::-webkit-scrollbar{display:none}
.gc{flex:none;width:166px;height:122px;scroll-snap-align:start;border-radius:22px;padding:13px 14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:var(--ink);position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.74) 60%,rgba(255,255,255,.82) 100%);
  border:1px solid rgba(255,255,255,.95);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:inset 0 0 20px rgba(255,255,255,.6)}
.gc::before{content:"";position:absolute;width:150px;height:150px;right:-60px;top:-70px;border-radius:50%;background:radial-gradient(circle,rgba(135,145,255,.18),transparent 65%);pointer-events:none}
.gc .t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;line-height:1.2;color:var(--ink-2);position:relative;z-index:1}
.gc .t i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--b);font-style:normal;flex:none}
.gc .t i svg{width:15px;height:15px}
.gc .v{position:relative;z-index:1;min-width:0}
.gc .v b{display:block;font-family:var(--f-num);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.1;color:#3E4CF0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc .v small{display:block;font-size:11.5px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* segmented, quick actions */
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;margin-top:14px}
.seg button{flex:1;padding:8px 10px;border-radius:999px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink)}
.seg button:first-child{flex:1.7}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:16px}
.qa{display:grid;justify-items:center;gap:8px;padding:12px 2px 10px;border-radius:var(--r-lg);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.qa i{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-style:normal}
.qa i svg{width:20px;height:20px}
.qa.q1 i{color:var(--b);background:var(--tint)} .qa.q2 i{color:#0E8A73;background:#DDF4EE} .qa.q3 i{color:#B86E00;background:#FFF0D4} .qa.q4 i{color:#C0367A;background:#FCE4EF}

.sh{display:flex;justify-content:space-between;align-items:center;margin:26px 2px 12px;gap:10px}
.sh h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:-.01em}
.sh .more{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-size:12.5px;font-weight:600;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));white-space:nowrap}
.sh .more svg{width:13px;height:13px}
.sh .meta{font-size:12.5px;color:var(--ink-3);font-weight:500}

/* rows on one continuous panel */
.rows{display:grid;background:var(--glass);-webkit-backdrop-filter:blur(20px) saturate(150%);backdrop-filter:blur(20px) saturate(150%);border:1px solid var(--edge);border-radius:var(--r-xl);padding:4px 14px;box-shadow:var(--inset)}
.rows>.row+.row{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:13px 2px;background:none;border:0;text-align:left;width:100%}
.row.solo{background:var(--row);border:1px solid var(--edge);border-radius:var(--r-lg);padding:12px}
.row .main{flex:1;min-width:0}
.row .name{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;min-width:0}
.row .name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .sub{font-size:12.5px;color:var(--ink-3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .amt{text-align:right;flex:none}
.row .amt .v{font-family:var(--f-num);font-weight:700;font-size:16px;letter-spacing:-.01em}
.row .amt .v small{font-size:12px;color:var(--ink-3);font-weight:600}
.row .amt .p{font-size:11.5px;color:var(--ink-3)}
.row.muted{opacity:.62}
.tile{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--c);background:#fff;border:1px solid rgba(36,37,39,.07)}
.tile svg{width:21px;height:21px}
.chip{display:inline-flex;align-items:center;flex:none;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:7px;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)} .chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.violet{background:var(--violet-soft);color:var(--violet)} .chip.grey{background:rgba(36,37,39,.06);color:var(--ink-2)}
.empty{color:var(--ink-3);text-align:center;padding:22px;font-size:14px}
.save{border-radius:var(--r-xl);padding:18px;display:grid;gap:12px}
.save .big{font-family:var(--f-num);font-weight:700;font-size:30px;letter-spacing:-.02em;color:var(--good)}
.save p{margin:0;font-size:13.5px;color:var(--ink-2)}
.save .list{display:flex;flex-wrap:wrap;gap:6px}
.demo{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-2);padding:9px 14px;border-radius:14px;margin-top:14px;background:rgba(255,255,255,.55);border:1px dashed rgba(135,145,255,.45)}
.demo button{color:var(--b);font-weight:600;font-size:12.5px}
.filters{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters button{padding:8px 13px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap;background:rgba(255,255,255,.7);border:1px solid var(--edge);color:var(--ink-2)}
.filters button[aria-pressed="true"]{color:#fff;background:linear-gradient(135deg,var(--a),var(--b));border-color:transparent}

/* calendar */
.cal{border-radius:var(--r-xl);padding:14px 12px 10px}
.cal-head{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px}
.cal-head b{font-family:var(--f-display);font-weight:700;font-size:18px}
.cal-head b::first-letter{text-transform:uppercase}
.cal-nav{display:flex;gap:6px}
.cal-nav button{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.75)}
.cal-nav svg{width:16px;height:16px}
.wd,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd span{font-size:11px;font-weight:600;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase;padding:4px 0 6px}
.day{height:46px;border-radius:13px;display:grid;justify-items:center;align-content:center;gap:3px;font-family:var(--f-num);font-weight:600;font-size:14.5px;color:var(--ink)}
.day.out{color:var(--ink-3);opacity:.45}
.day.has{background:rgba(255,255,255,.6)}
.day.today{color:var(--b);box-shadow:inset 0 0 0 1.5px var(--a)}
.day[aria-pressed="true"]{color:#fff;background:linear-gradient(145deg,var(--a),var(--b))}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}
.tl{display:grid;gap:10px}
.tl-item{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:center;position:relative}
.tl-dot{width:20px;height:20px;border-radius:50%;background:#fff;border:2.5px solid var(--c)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 2px 10px}
.day-h b{font-family:var(--f-display);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.03em}
.day-h span{font-size:12.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}

/* analytics */
.ring-card{border-radius:var(--r-xl);padding:20px;display:grid;justify-items:center;gap:6px;margin-top:14px}
.ring{position:relative;width:200px;height:200px;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--f-num);font-weight:700;font-size:30px;letter-spacing:-.02em}
.ring .c span{font-size:12px;color:var(--ink-3)}
.cats{display:grid;gap:12px;width:100%;margin-top:10px}
.cat{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;font-size:13.5px}
.cat i{width:10px;height:10px;border-radius:4px;display:block}
.cat .track{grid-column:2/4;height:7px;border-radius:99px;background:rgba(36,37,39,.06);overflow:hidden}
.cat .track div{height:100%;border-radius:99px}
.cat .v{font-family:var(--f-num);font-weight:600;white-space:nowrap}

/* profile/home tab */
.card{border-radius:var(--r-xl);padding:16px}
.members{display:grid;gap:12px}
.member{display:flex;align-items:center;gap:12px}
.member .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:700;color:#fff;flex:none}
.member .av img{width:100%;height:100%;object-fit:cover}
.member .main{flex:1;min-width:0}
.member .bar{height:6px;border-radius:99px;background:rgba(36,37,39,.06);margin-top:6px;overflow:hidden}
.member .bar div{height:100%;border-radius:99px}
.code{font-family:var(--f-num);font-weight:700;font-size:26px;letter-spacing:.2em;text-align:center;padding:12px;border-radius:var(--r-md);background:rgba(255,255,255,.75)}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.plan{border-radius:var(--r-lg);padding:14px;display:grid;gap:6px;align-content:start;border:1.5px solid transparent}
.plan.on{border-color:var(--a)}
.plan b{font-family:var(--f-num);font-size:22px;font-weight:700}
.plan ul{margin:4px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink-2);display:grid;gap:3px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border-bottom:0}
.setrow>div{min-width:0}
.setrow p{margin:2px 0 0;font-size:12.5px;color:var(--ink-3)}
.locked{border-radius:var(--r-lg);padding:16px;display:grid;gap:8px;margin-top:14px;background:linear-gradient(135deg,rgba(135,145,255,.18),rgba(94,108,255,.1));border:1px solid rgba(135,145,255,.35)}
.locked b{font-family:var(--f-display);font-size:17px}
.locked span{font-size:13.5px;color:var(--ink-2)}

/* controls */
.btn{border-radius:16px;padding:13px 18px;font-weight:600;font-size:15px;text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:18px;height:18px}
.btn.primary{color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}
.btn.soft{background:rgba(255,255,255,.85);color:var(--ink)}
.btn.danger{background:var(--crit-soft);color:var(--crit)}
.btn.small{padding:9px 14px;font-size:13.5px;border-radius:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.actions .btn{flex:1 1 130px}
.switch{position:relative;width:50px;height:30px;flex:none}
.switch input{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:rgba(36,37,39,.14);transition:background .2s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.switch input:checked+span{background:linear-gradient(135deg,var(--a),var(--b))}
.switch input:checked+span::after{transform:translateX(20px)}
.switch input:focus-visible+span{outline:2px solid var(--b);outline-offset:2px}
.field{display:grid;gap:6px;min-width:0}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.field input,.field select{background:rgba(255,255,255,.85);border:1px solid rgba(36,37,39,.08);border-radius:14px;padding:12px 13px;width:100%;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.confirm{background:var(--crit-soft);color:var(--crit);border-radius:var(--r-md);padding:12px;display:grid;gap:10px;font-size:14px}
.langseg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid rgba(36,37,39,.06)}
.langseg button{padding:10px 6px;border-radius:11px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.langseg button[aria-pressed="true"]{background:#fff;color:var(--b)}

/* detail */
.d-hero{border-radius:var(--r-xl);padding:18px}
.d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.d-name{display:flex;gap:14px;align-items:center;margin-top:12px}
.d-name .tile{width:62px;height:62px}
.d-name .tile svg{width:30px;height:30px}
.d-name b{font-family:var(--f-display);font-weight:700;font-size:24px;display:block;line-height:1.1}
.d-name small{font-size:13px;color:var(--ink-3)}
.d-amt{display:flex;align-items:baseline;gap:4px;margin-top:14px;flex-wrap:wrap}
.d-amt .int{font-family:var(--f-num);font-weight:700;font-size:40px;letter-spacing:-.03em;line-height:1}
.d-amt .dec{font-family:var(--f-num);font-weight:600;font-size:18px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border-radius:var(--r-lg);padding:14px;display:grid;gap:4px;min-width:0}
.stat .k{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);white-space:nowrap;overflow:hidden}
.stat .k svg{width:14px;height:14px;flex:none}
.stat b{font-family:var(--f-display);font-weight:700;font-size:18px;line-height:1.15}
.stat small{font-size:12px;color:var(--ink-3)}
.toggles{border-radius:var(--r-lg);padding:4px 14px}
.tg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.tg:last-child{border-bottom:0}
.tg .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--tint);color:var(--b);flex:none}
.tg .ic svg{width:19px;height:19px}
.tg .main{flex:1;min-width:0}
.tg b{font-size:14.5px;font-weight:600;display:block}
.tg small{font-size:12px;color:var(--ink-3)}

/* profile sheet */
.pf-head{display:flex;flex-direction:column;align-items:center;gap:12px;padding:6px 0 4px}
.pf-av{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-weight:700;font-size:38px;color:#fff;background:linear-gradient(145deg,var(--a),var(--b));position:relative}
.pf-av img{width:100%;height:100%;object-fit:cover}
.pf-cam{position:absolute;right:2px;bottom:2px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--b);border:1px solid rgba(36,37,39,.08)}
.pf-cam svg{width:17px;height:17px}
.pf-photo-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hint{font-size:12px;color:var(--ink-3);text-align:center;margin:0}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
nav.tabs .in{pointer-events:auto;max-width:400px;margin:0 auto;border-radius:999px;padding:8px 10px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:rgba(255,255,255,.62)}
nav.tabs [data-tab]{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--ink-3);border-radius:999px;min-width:0}
nav.tabs [data-tab] span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs [data-tab] svg{width:22px;height:22px}
nav.tabs [aria-current="page"]{color:var(--b)}
nav.tabs .fab{justify-self:center;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,var(--a),var(--b));box-shadow:inset 0 1px 0 rgba(255,255,255,.4);margin-block:-14px}
nav.tabs .fab svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(36,37,39,.22);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92%;overflow-y:auto;border-radius:30px 30px 0 0;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px));background:rgba(244,245,250,.92);-webkit-backdrop-filter:blur(26px) saturate(160%);backdrop-filter:blur(26px) saturate(160%);border-top:1px solid var(--edge)}
.sheet .in{max-width:460px;margin:0 auto;display:grid;gap:12px}
.grab{width:42px;height:5px;border-radius:9px;background:rgba(36,37,39,.16);margin:4px auto 6px}
.sheet h3{font-family:var(--f-display);font-weight:700;font-size:22px;margin:2px 0 0}
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.preset{border-radius:var(--r-md);padding:12px 6px;display:grid;justify-items:center;gap:7px;font-size:12.5px;font-weight:600;text-align:center;background:rgba(255,255,255,.8)}
.preset .tile{width:40px;height:40px}
.preset .tile svg{width:20px;height:20px}
.toast{position:fixed;left:50%;bottom:108px;transform:translateX(-50%);z-index:30;background:rgba(36,37,39,.9);color:#fff;padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .sheet{animation:up .28s cubic-bezier(.2,.8,.2,1)}
  @keyframes up{from{transform:translateY(48px);opacity:.5}}
  .menu{animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateY(-4px);opacity:0}}
}
/* variant B home: two glass cards instead of four; stronger grey contrast; type sizes as in A */
body.simple{--ink-2:rgba(36,37,39,.78);--ink-3:rgba(36,37,39,.6)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.duo-card{position:relative;overflow:hidden;display:grid;gap:2px;text-align:left;padding:13px 14px;min-height:118px;align-content:space-between;border-radius:22px;color:var(--ink);min-width:0;
  background:linear-gradient(150deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.74) 60%,rgba(255,255,255,.82) 100%);
  border:1px solid rgba(255,255,255,.95);-webkit-backdrop-filter:blur(18px) saturate(150%);backdrop-filter:blur(18px) saturate(150%);box-shadow:inset 0 0 20px rgba(255,255,255,.6)}
.duo-card::before{content:"";position:absolute;width:150px;height:150px;right:-60px;top:-70px;border-radius:50%;background:radial-gradient(circle,rgba(135,145,255,.18),transparent 65%);pointer-events:none}
.duo-card>*{position:relative}
.duo-card .t{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;line-height:1.2;color:var(--ink-2)}
.duo-card .t i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--tint);color:var(--b);font-style:normal;flex:none}
.duo-card .t i svg{width:15px;height:15px}
.duo-card b{display:block;font-family:var(--f-num);font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.1;color:#3E4CF0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:14px}
.duo-card b.good{color:var(--good)}
.duo-card small{display:block;font-size:11.5px;color:var(--ink-3)}

/* dark theme (chosen in the profile) */

  --glass:rgba(30,32,44,.62);--edge:rgba(255,255,255,.08);--row:rgba(30,32,44,.72);--tint:#262A4A;--b:#7B87FF;
  --good:#3DD39A;--good-soft:#143326;--warn:#F0B44C;--warn-soft:#3A2C12;--crit:#FF7B72;--crit-soft:#3D1E1E;--violet:#B3A9FF;--violet-soft:#2C2850;--inset:inset 0 0 23px rgba(255,255,255,.03)}
body.dark .ambient{background:radial-gradient(55% 32% at 8% 0%,rgba(135,145,255,.22),transparent 72%),radial-gradient(45% 30% at 100% 6%,rgba(120,170,255,.16),transparent 72%),linear-gradient(180deg,#151827 0%,var(--bg) 46%)}
body.dark .top{background:radial-gradient(70% 55% at 92% 2%,rgba(120,170,255,.35),transparent 70%),radial-gradient(60% 50% at 0% 30%,rgba(120,95,255,.3),transparent 70%),linear-gradient(180deg,#2B36C9 0%,#3D49E0 34%,#4A55D6 62%,rgba(74,85,214,.35) 84%,rgba(15,17,23,0) 100%)}
body.dark .gc,body.dark .duo-card{background:linear-gradient(150deg,rgba(44,48,74,.92) 0%,rgba(30,32,48,.84) 60%,rgba(36,40,62,.9) 100%);border-color:rgba(255,255,255,.12);box-shadow:none}

body.dark .langseg button[aria-pressed="true"]{color:#AEB5FF}

body.dark .demo{background:rgba(30,32,44,.6)}

body.dark .preset{background:#1E2130}

body.dark .switch span{background:rgba(255,255,255,.18)}

body.dark .qa.q1 i{background:#262A4A;color:#AEB5FF} body.dark .qa.q2 i{background:#12352E;color:#4FD1B5} body.dark .qa.q3 i{background:#3A2C12;color:#F0B44C} body.dark .qa.q4 i{background:#3D1E30;color:#F27BB5}

@media (max-width:370px){.amount .int{font-size:44px}.quick{gap:6px}.lang-btn{padding:0 10px}}
.pf-sec{font-family:var(--f-display);font-weight:700;font-size:17px;margin:14px 2px 0}
.ask{margin-top:14px;padding:16px;border-radius:24px;display:grid;gap:10px}
.ask-top{display:flex;align-items:center;gap:12px}.ask-top b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700}.ask-top small{font-size:12.5px;color:var(--ink-3)}
.ask p{margin:0;font-weight:600;font-size:15px}.ask-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* onboarding */
body.onb .tabs{display:none}
.ob{position:fixed;inset:0;z-index:60;display:flex;justify-content:center;background:var(--bg);overflow-y:auto}
.ob-in{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column}
.ob-hero{position:relative;flex:0 0 auto;min-height:46vh;padding:14px 18px 34px;display:flex;flex-direction:column;color:#fff;background:
  radial-gradient(70% 55% at 92% 2%,rgba(170,210,255,.6),transparent 70%),radial-gradient(60% 50% at 0% 30%,rgba(120,95,255,.35),transparent 70%),
  linear-gradient(180deg,#3E4CF0 0%,#5866FF 40%,#7F8AFF 72%,rgba(135,145,255,.35) 90%,rgba(240,241,246,0) 100%)}
.ob-bar{display:flex;justify-content:space-between;align-items:center;min-height:40px}
.ob-bar button{color:#fff;font-weight:600;font-size:14px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34)}
.ob-bar .ob-backbtn{width:40px;height:40px;padding:0;display:grid;place-items:center}.ob-bar svg{width:18px;height:18px}
.ob-brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:-.01em}
.ob-art{flex:1;display:grid;place-items:center;padding-top:14px}
.ob-stack{width:100%;max-width:330px;display:grid;gap:8px}
.ob-mini{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:20px;background:rgba(255,255,255,.9);color:var(--ink);border:1px solid rgba(255,255,255,.95);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.ob-mini .tile{width:38px;height:38px}.ob-mini b{flex:1;font-weight:700;font-size:15px}.ob-mini .num{font-weight:700}
.ob-mini:nth-child(2){transform:translateX(14px)}.ob-mini:nth-child(3){transform:translateX(-8px)}
.ob-askmini{width:100%;max-width:330px;padding:16px;border-radius:24px;background:rgba(255,255,255,.92);color:var(--ink);display:grid;gap:10px}
.ob-askmini .top-l{display:flex;gap:12px;align-items:center}.ob-askmini small{font-size:12.5px;color:var(--ink-3)}.ob-askmini b{display:block;font-family:var(--f-display);font-size:17px}
.ob-askmini p{margin:0;font-weight:600}.ob-askmini .ab{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ob-askmini .ab span{text-align:center;padding:9px;border-radius:14px;font-size:13.5px;font-weight:600;background:#EEF0F7}.ob-askmini .ab span+span{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
.ob-save{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);font-weight:600;font-size:14px}
.ob-save svg{width:16px;height:16px;flex:0 0 auto}
.ob-logo{width:84px;height:84px;border-radius:28px;display:grid;place-items:center;background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 0 24px rgba(255,255,255,.3)}
.ob-logo svg{width:40px;height:40px}
.ob-body{flex:1;display:flex;flex-direction:column;gap:14px;padding:6px 22px calc(24px + env(safe-area-inset-bottom))}
.ob-body h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}

.ob-dots{display:flex;gap:6px}.ob-dots i{width:7px;height:7px;border-radius:99px;background:rgba(94,108,255,.22);transition:width .25s}.ob-dots i.on{width:22px;background:var(--b)}
.ob-foot{margin-top:auto;display:grid;gap:10px;padding-top:10px}

.ob-langs{display:grid;gap:10px}
.ob-opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px 16px;border-radius:20px;background:rgba(255,255,255,.88);border:1.5px solid rgba(36,37,39,.06)}
.ob-opt b{display:block;font-size:16px}.ob-opt small{font-size:13px;color:var(--ink-3)}.ob-opt .main{flex:1;min-width:0}
.ob-opt .code{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:#EEF0FF;color:var(--b)}
.ob-opt .rad{width:22px;height:22px;border-radius:50%;border:2px solid rgba(36,37,39,.18);flex:0 0 auto}
.ob-opt[aria-pressed="true"]{border-color:var(--b);background:#fff}.ob-opt[aria-pressed="true"] .rad{border:6px solid var(--b)}
.ob-opt:focus-visible{outline:2px solid var(--b);outline-offset:2px}
body.dark .ob-opt{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.08)}body.dark .ob-opt[aria-pressed="true"]{background:rgba(135,145,255,.14);border-color:var(--a)}
body.dark .ob-opt .code{background:rgba(135,145,255,.18);color:#C9CEFF}
body.dark .ob-hero{background:radial-gradient(70% 55% at 92% 2%,rgba(170,210,255,.35),transparent 70%),linear-gradient(180deg,#2A33A8 0%,#3E4CF0 45%,rgba(94,108,255,.35) 88%,rgba(15,17,23,0) 100%)}
.inst-hero{display:grid;place-items:center;padding:6px 0 2px}
.inst-app{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,#3E4CF0,#8791FF)}.inst-app svg{width:38px;height:38px}
.inst-steps{list-style:none;margin:0;padding:12px 14px;display:grid;gap:12px;border-radius:20px;background:rgba(255,255,255,.75)}

.inst-n{flex:0 0 auto;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--a),var(--b))}

a.btn{text-decoration:none}
/* safe areas for installed app (env() is 0 in a normal browser tab) */
.app{padding-top:calc(6px + env(safe-area-inset-top,0px))}
.top{margin-top:calc(-6px - env(safe-area-inset-top,0px));padding-top:calc(6px + env(safe-area-inset-top,0px))}
.ob-hero{padding-top:calc(14px + env(safe-area-inset-top,0px))}
.ob-hero.short{min-height:0;padding-bottom:18px}.ob-hero.short .ob-art{padding:4px 0 6px}.ob-hero.short .ob-logo{width:64px;height:64px;border-radius:22px}.ob-hero.short .ob-logo svg{width:30px;height:30px}

.ob-chip .tile{width:32px;height:32px}.ob-chip .tile svg{width:16px;height:16px}

.btn[disabled]{opacity:.45;cursor:not-allowed}
.ob-rows{display:grid;gap:8px}
.ob-row{display:grid;grid-template-columns:auto 1fr auto;grid-template-areas:"ic main amt" "ic date date";gap:6px 12px;align-items:center;padding:12px 14px;border-radius:20px;background:rgba(255,255,255,.88)}
.ob-row .tile{grid-area:ic;align-self:start}.ob-row-main{grid-area:main;min-width:0}.ob-row-main b{display:block;font-size:15px}.ob-row-main small{font-size:12.5px;color:var(--ink-3)}

/* ---------- dates & money ---------- */
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function iso(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
function parse(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function addMonths(d,n,day){ const x=new Date(d.getFullYear(),d.getMonth()+n,1); const last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(); x.setDate(Math.min(day,last)); return x; }
function nextDue(p){ const b=parse(p.date), tt=today(); let d=b,i=0; while(d<tt&&i<600){ i++; d=addMonths(b,p.cycle*i,b.getDate()); } return d; }
function occursIn(p,y,m){ const b=parse(p.date); const diff=(y*12+m)-(b.getFullYear()*12+b.getMonth()); if(((diff%p.cycle)+p.cycle)%p.cycle!==0) return null; return addMonths(b,diff,b.getDate()); }
function daysTo(d){ return Math.round((d-today())/DAY); }
function rel(n){ return n===0?t("today"):n===1?t("tomorrow"):n<0?t("ago",{n:-n}):t("in_days",{n}); }
const dShort=d=>d.toLocaleDateString(loc(),{day:"numeric",month:"short"});
const dLong=d=>d.toLocaleDateString(loc(),{day:"numeric",month:"long",year:"numeric"});
const dDM=d=>d.toLocaleDateString(loc(),{day:"numeric",month:"long"});
const dHead=d=>d.toLocaleDateString(loc(),{weekday:"long",day:"numeric",month:"long"});
const dMonth=(y,m)=>new Date(y,m,1).toLocaleDateString(loc(),{month:"long",year:"numeric"});
function offset(n){ return iso(new Date(today().getTime()+n*DAY)); }
function monthsAgo(n){ const x=today(); return iso(new Date(x.getFullYear(),x.getMonth()-n,Math.min(x.getDate(),28))); }
function pln(p){ return p.amount*(RATES[p.currency]||1); }
function monthly(p){ return pln(p)/p.cycle; }
function fmt(v,dec){ return v.toLocaleString("pl-PL",{minimumFractionDigits:dec??2,maximumFractionDigits:dec??2}); }
function money(v,dec){ return fmt(v,dec)+" zł"; }
function splitHTML(v){ const s=fmt(v), i=s.lastIndexOf(","); return `<span class="int">${s.slice(0,i)}</span><span class="dec">,${s.slice(i+1)} zł</span>`; }
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function initials(n){ const w=String(n||"?").trim().split(/\s+/); return ((w[0]||"?")[0]+((w[1]||"")[0]||"")).toUpperCase(); }
function totalSpent(p){ const s=parse(p.since||p.date), tt=today(); let n=0,d=s,i=0; while(d<=tt&&i<600){ n++; i++; d=addMonths(s,p.cycle*i,s.getDate()); } return n*pln(p); }

function genHistory(months){
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return (seed-1)/2147483646; };
  const T=[["Biedronka","food",60,220,2,4],["Lidl","food",50,200,1,3],["Żabka","food",12,40,1,3],["Orlen","transport",150,280,1,2],["Bolt","transport",18,45,0,2],["Pizzeria","eatout",60,160,0,2],["Rossmann","shopping",30,120,0,2],["Allegro","shopping",40,300,0,2],["Apteka","zdrowie",20,90,0,1],["Kino","rozrywka",40,80,0,1]];
  const x=today(), out=[]; let n=0;
  for(let b=1;b<=months;b++){ const d0=new Date(x.getFullYear(),x.getMonth()-b,1), mo=d0.getMonth();
    T.forEach(([name,cat,lo,hi,cmin,cmax])=>{ let k=1; if(cat==="shopping"&&mo===11) k=2.2; if(cat==="eatout"&&(mo===6||mo===7)) k=1.5; if(cat==="food"&&mo===11) k=1.3;
      const cnt=cmin+Math.floor(rnd()*(cmax-cmin+1)); for(let i=0;i<cnt;i++){ const amt=Math.round((lo+rnd()*(hi-lo))*k*100)/100; out.push({id:"h"+(n++),name,cat,amount:amt,date:iso(new Date(d0.getFullYear(),mo,1+Math.floor(rnd()*27))),payer:"m1"}); } }); }
  return out;
}

const root=document.getElementById("sheetRoot");
function closeSheet(){ root.innerHTML=""; document.body.style.overflow=""; }
function openSheet(html){ root.innerHTML=`<div class="scrim" data-close></div><div class="sheet" role="dialog" aria-modal="true"><div class="in"><div class="grab"></div><button type="button" class="sheet-x" data-close aria-label="${t("close")}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>${html}</div></div>`; document.body.style.overflow="hidden"; const f=root.querySelector(".sheet button:not([data-close]),.sheet input"); if(f) f.focus({preventScroll:true}); }
root.addEventListener("click",e=>{ if(e.target.closest("[data-close]")){ closeSheet(); return; }
  const pr=e.target.closest('[data-act="profile"]'); if(pr){ openProfile(); return; }
  const o=e.target.closest("[data-open]"); if(o&&!e.target.closest("[data-d]")) openDetail(o.dataset.open); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ const box=document.getElementById("langMenu"); if(box&&box.innerHTML){ box.innerHTML=""; return; } if(root.innerHTML) closeSheet(); } });

function openAlerts(){ const al=alerts(); openSheet(`<h3>${t("reminders")}</h3><p style="margin:0;font-size:13.5px;color:var(--ink-2)">${t("reminders_t")}</p>${askCard()}${al.length?`<div class="rows">${al.map(({p})=>row(p)).join("")}</div>`:`<div class="empty">${t("no_rem")}</div>`}<button type="button" class="btn soft" data-close>${t("close")}</button>`); }

function openDetail(id){
  const p=S.items.find(x=>x.id===id); if(!p) return;
  const d=nextDue(p), n=daysTo(d);
  const chip=p.trial?`<span class="chip violet">${t("trial_chip",{x:rel(n)})}</span>`:n<=1?`<span class="chip crit">${rel(n)}</span>`:n<=7?`<span class="chip warn">${t("days",{n})}</span>`:`<span class="chip grey">${rel(n)}</span>`;
  const sw=(k,on,l)=>`<label class="switch"><input type="checkbox" data-d="${k}" ${on?"checked":""} aria-label="${l}"><span></span></label>`;
  openSheet(`<section class="d-hero glass"><div class="d-top">${chip}<button type="button" class="pill-btn" data-d="paid">${t("paid")} ${svg(UI.check,2.4)}</button></div>
    <div class="d-name">${tile(p)}<div><b>${esc(pname(p))}</b><small>${hasPartner()?t("paid_by",{c:catName(p.cat),w:esc(memberName(p.payer))}):catName(p.cat)}</small></div></div>
    <div class="d-amt">${splitHTML(pln(p))}<span style="font-size:14px;color:var(--ink-3);margin-left:4px">${per(p.cycle)}</span></div>
    ${p.currency!=="PLN"?`<div style="font-size:12.5px;color:var(--ink-3);margin-top:4px">${t("approx_rate",{x:fmt(p.amount)+" "+p.currency})}</div>`:""}</section>
  <div class="stats">
    <div class="stat glass"><span class="k">${svg(UI.cal)}${t("next_pay")}</span><b>${dDM(d)}</b><small>${rel(n)}</small></div>
    <div class="stat glass"><span class="k">${svg(UI.repeat)}${t("cycle")}</span><b>${cyc(p.cycle)}</b><small>${t("since",{d:dLong(parse(p.since||p.date))})}</small></div>
    <div class="stat glass"><span class="k">${svg(UI.clock)}${t("spent")}</span><b class="num">${money(totalSpent(p),0)}</b><small>${t("a_year",{x:money(monthly(p)*12,0)})}</small></div>
    <div class="stat glass"><span class="k">${svg(UI.tag)}${t("category")}</span><b>${catName(p.cat)}</b><small>${hasPartner()?esc(memberName(p.payer)):per(p.cycle)}</small></div></div>
  ${p.note?`<section class="note-card glass"><span class="label">${t("f_note")}</span><p>${esc(p.note)}</p></section>`:""}
  <section class="toggles glass">
    <div class="tg"><span class="ic">${svg(UI.bell)}</span><div class="main"><b>${t("reminder")}</b><small>${remindLabel(p.remind)}</small></div>${sw("remind",p.remind>=0,t("reminder"))}</div>
    <div class="tg"><span class="ic">${svg(UI.gift)}</span><div class="main"><b>${t("trial")}</b><small>${t("trial_t")}</small></div>${sw("trial",!!p.trial,t("trial"))}</div>
    ${isSub(p)?`<div class="tg"><span class="ic">${svg(UI.eyeOff)}</span><div class="main"><b>${t("unused_t")}</b><small>${t("unused_tt")}</small></div>${sw("unused",!!p.unused,t("unused_t"))}</div>`:""}</section>
  <div class="actions"><button type="button" class="btn soft" data-d="edit">${t("edit")}</button><button type="button" class="btn danger" data-d="del">${t("del")}</button></div><div id="delBox"></div>`);
  const sh=root.querySelector(".sheet");
  sh.addEventListener("change",e=>{ const k=e.target.dataset.d; if(!k) return; if(k==="remind") p.remind=e.target.checked?(S.profile.remind>=0?S.profile.remind:2):-1; if(k==="trial") p.trial=e.target.checked; if(k==="unused") p.unused=e.target.checked; save(); render(); openDetail(p.id); });
  sh.addEventListener("click",e=>{ const b=e.target.closest("[data-d]"); if(!b||b.tagName==="INPUT") return; const k=b.dataset.d;
    if(k==="paid"){ const nd=addMonths(d,p.cycle,parse(p.date).getDate()); p.date=iso(nd); p.trial=false; save(); render(); closeSheet(); track("marked_paid",{category:p.cat}); toast(t("t_paid",{n:pname(p),d:dDM(nd)})); }
    if(k==="edit") openEdit(p);
    if(k==="del") root.querySelector("#delBox").innerHTML=`<div class="confirm"><span>${t("del_q",{n:esc(pname(p))})}</span><div class="actions"><button type="button" class="btn danger" data-d="delYes">${t("del")}</button><button type="button" class="btn soft" data-d="delNo">${t("keep")}</button></div></div>`;
    if(k==="delYes"){ const nm=pname(p); S.items=S.items.filter(x=>x.id!==p.id); save(); render(); closeSheet(); toast(t("t_del",{n:nm})); }
    if(k==="delNo") root.querySelector("#delBox").innerHTML=""; });
}

function openPresets(){
  const limit=!S.premium&&S.items.length>=FREE_LIMIT;
  if(limit&&VARIANT!=="c"){ openSheet(`<h3>${t("limit")}</h3><p style="margin:0;color:var(--ink-2)">${t("limit_t",{a:S.items.length,b:FREE_LIMIT})}</p><div class="actions"><button type="button" class="btn primary" data-act="profile">${t("see_prem")}</button><button type="button" class="btn soft" data-close>${t("close")}</button></div>`); return; }
  openSheet(`<h3>${t("what")}</h3>
    ${VARIANT==="c"?`<button type="button" class="btn primary" data-newexp>${svg(UI.plus,2.4)}${t("add_exp")}</button>`:""}
    ${limit?`<div class="locked" style="margin-top:0"><b>${t("limit")}</b><span>${t("limit_t",{a:S.items.length,b:FREE_LIMIT})}</span></div>`:`
    <button type="button" class="btn ${VARIANT==="c"?"soft":"primary"}" data-preset="|inne|1">${svg(UI.repeat,2.2)}${VARIANT==="c"?t("add_sub"):t("new_pay")}</button>
    <p class="hint" style="margin:-2px 0 2px">${t("or_pick")}</p>
    ${PRESETS.map(([c,items])=>`<div style="display:grid;gap:8px"><span class="label">${catName(c)}</span><div class="preset-grid">${items.map(([k,cy])=>{ const cat=PRESET_CAT[k]; return `<button type="button" class="preset" data-preset="${k}|${cat}|${cy}">${tile({k,cat})}${esc(t("p_"+k))}</button>`; }).join("")}</div></div>`).join("")}`}`);
  root.querySelectorAll("[data-preset]").forEach(b=>b.addEventListener("click",()=>{ const [k,c,cy]=b.dataset.preset.split("|"); openEdit(null,{k:k||null,cat:c,cycle:Number(cy)}); }));
  const ne=root.querySelector("[data-newexp]"); if(ne) ne.addEventListener("click",()=>openExpense(null));
}
const opt=(pairs,v)=>pairs.map(([k,l])=>`<option value="${k}" ${String(k)===String(v)?"selected":""}>${esc(l)}</option>`).join("");
function payerField(id,v){ return hasPartner()?`<div class="field"><label for="${id}">${t("f_payer")}</label><select id="${id}">${opt(S.members.map(m=>[m.id,mname(m)]),v)}</select></div>`:""; }
function amountOf(input){ const amt=parseFloat(input.value.replace(/\s/g,"").replace(",",".")); if(!(amt>0)){ input.setCustomValidity(t("v_amount")); input.reportValidity(); input.oninput=()=>input.setCustomValidity(""); return null; } return amt; }

function openEdit(p,preset){
  const isNew=!p;
  const d=p||{id:uid("p"),k:preset.k,name:null,cat:preset.cat,amount:"",currency:"PLN",cycle:preset.cycle,date:offset(7),since:iso(today()),payer:"m1",remind:preset.cycle>=12?14:S.profile.remind};
  const nm=d.name||(d.k?t("p_"+d.k):"");
  const cats=REC_CATS.includes(d.cat)?REC_CATS:[d.cat,...REC_CATS];
  openSheet(`<div style="display:flex;align-items:center;gap:12px">${tile(d)}<h3>${isNew?t("new_title"):t("edit_title")}</h3></div>
  <form id="editForm" novalidate style="display:grid;gap:12px">
    <div class="field"><label for="f-name">${t("f_name")}</label><input id="f-name" required maxlength="40" value="${esc(nm)}" placeholder="${t("ph_name")}"></div>
    <div class="two"><div class="field"><label for="f-amount">${t("f_amount")}</label><input id="f-amount" required inputmode="decimal" value="${d.amount===""?"":String(d.amount).replace(".",",")}" placeholder="0,00"></div>
      <div class="field"><label for="f-cur">${t("f_cur")}</label><select id="f-cur">${opt([["PLN","PLN"],["EUR","EUR"],["USD","USD"]],d.currency)}</select></div></div>
    <div class="two"><div class="field"><label for="f-cycle">${t("f_cycle")}</label><select id="f-cycle">${opt([1,2,3,6,12].map(c=>[c,cyc(c)]),d.cycle)}</select></div>
      <div class="field"><label for="f-date">${t("f_date")}</label><input id="f-date" type="date" required value="${d.date}"></div></div>
    <div class="${hasPartner()?"two":""}"><div class="field"><label for="f-cat">${t("f_cat")}</label><select id="f-cat">${opt(cats.map(c=>[c,catName(c)]),d.cat)}</select></div>${payerField("f-payer",d.payer)}</div>
    <div class="field"><label for="f-type">${t("f_type")}</label><select id="f-type">${opt([["bill",t("ty_bill")],["sub",t("ty_sub")]],ptype(d))}</select></div>
    <div class="two"><div class="field"><label for="f-since">${t("f_since")}</label><input id="f-since" type="date" value="${d.since||d.date}"></div>
      <div class="field"><label for="f-remind">${t("f_remind")}</label><select id="f-remind" ${S.premium?"":"disabled"}>${opt(REMIND_OPTS.map(v=>[v,remindLabel(v)]),S.premium?d.remind:1)}</select></div></div>
    ${S.premium?"":`<span style="font-size:12px;color:var(--b)">${t("rem_prem")}</span>`}
    <div class="field"><label for="f-note">${t("f_note")}</label><textarea id="f-note" rows="2" maxlength="300" placeholder="${t("ph_note")}">${esc(d.note||"")}</textarea></div>
    <div class="actions"><button class="btn primary" type="submit">${isNew?t("b_add"):t("b_save")}</button><button type="button" class="btn soft" data-close>${t("cancel")}</button></div>
  </form>`);
  const f=root.querySelector("#editForm"); let typeTouched=!!d.type;
  f.querySelector("#f-type").addEventListener("change",()=>{ typeTouched=true; });
  f.querySelector("#f-cat").addEventListener("change",e=>{ if(!typeTouched) f.querySelector("#f-type").value=ASK_CATS.includes(e.target.value)?"sub":"bill"; });
  f.addEventListener("submit",e=>{ e.preventDefault(); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
    const amt=amountOf(f.querySelector("#f-amount")); if(amt==null) return;
    const nv=f.querySelector("#f-name").value.trim(), pf=f.querySelector("#f-payer");
    const np={...d,name:(d.k&&nv===t("p_"+d.k))?null:nv,amount:amt,currency:f.querySelector("#f-cur").value,cycle:Number(f.querySelector("#f-cycle").value),date:f.querySelector("#f-date").value||d.date||nextDay10(),cat:f.querySelector("#f-cat").value,payer:pf?pf.value:(d.payer||"m1"),since:f.querySelector("#f-since").value||f.querySelector("#f-date").value||d.since||iso(today()),remind:S.premium?Number(f.querySelector("#f-remind").value):1};
    np.note=(f.querySelector("#f-note").value||"").trim(); np.type=f.querySelector("#f-type").value; if(np.type!=="sub") np.unused=false;
    if(!isNew&&d.amount!==""&&Number(d.amount)!==amt){ np.hist=[...(d.hist||[]),{to:iso(today()),a:Number(d.amount)}]; }
    if(isNew) S.items.push(np); else S.items[S.items.findIndex(x=>x.id===d.id)]=np;
    save(); render(); if(isNew){ closeSheet(); toast(t("t_add",{n:pname(np)})); track("payment_added",{category:np.cat,cycle:np.cycle,preset:!!np.k,currency:np.currency,count:S.items.length}); maybeExPrompt(); } else { openDetail(np.id); toast(t("t_saved")); }
  });
}

function openExpense(e){
  const isNew=!e;
  const d=e||{id:uid("e"),name:"",cat:"food",amount:"",date:iso(today()),payer:"m1"};
  openSheet(`<div style="display:flex;align-items:center;gap:12px">${tile({name:d.name,cat:d.cat})}<h3>${isNew?t("exp_new"):t("exp_edit")}</h3></div>
  <form id="expForm" novalidate style="display:grid;gap:12px">
    <div class="field"><label for="x-name">${t("f_name")}</label><input id="x-name" required maxlength="40" value="${esc(d.name)}" placeholder="${t("ph_exp")}"></div>
    <div class="two"><div class="field"><label for="x-amount">${t("f_amount")}</label><input id="x-amount" required inputmode="decimal" value="${d.amount===""?"":String(d.amount).replace(".",",")}" placeholder="0,00"></div>
      <div class="field"><label for="x-date">${t("f_when")}</label><input id="x-date" type="date" required value="${d.date}"></div></div>
    <div class="${hasPartner()?"two":""}"><div class="field"><label for="x-cat">${t("f_cat")}</label><select id="x-cat">${opt([...expCats().map(c=>[c,catName(c)]),["__new",t("cat_new")]],expCats().includes(d.cat)?d.cat:"food")}</select></div>${payerField("x-payer",d.payer)}</div>
    <div id="xNewCat" class="newcat" hidden><div class="field"><label for="x-newcat">${t("cat_name")}</label><input id="x-newcat" maxlength="24" placeholder="${t("cat_ph")}"></div><button type="button" class="btn soft" id="xCatAdd">${t("cat_add")}</button></div>
    <div class="field"><label for="x-note">${t("f_note")}</label><textarea id="x-note" rows="2" maxlength="300" placeholder="${t("ph_note")}">${esc(d.note||"")}</textarea></div>
    <div class="actions"><button class="btn primary" type="submit">${isNew?t("add_exp"):t("b_save")}</button><button type="button" class="btn soft" data-close>${t("cancel")}</button></div>
    ${isNew?"":`<button type="button" class="btn danger" id="xDel">${t("del")}</button><div id="xDelBox"></div>`}
  </form>`);
  const f=root.querySelector("#expForm");
  const cs=f.querySelector("#x-cat"), nc=f.querySelector("#xNewCat"); let lastCat=cs.value;
  cs.addEventListener("change",()=>{ if(cs.value==="__new"){ nc.hidden=false; f.querySelector("#x-newcat").focus(); } else { nc.hidden=true; lastCat=cs.value; } });
  f.querySelector("#xCatAdd").addEventListener("click",()=>{ const inp=f.querySelector("#x-newcat"), nm=inp.value.trim(); if(!nm){ inp.focus(); return; }
    const ex=S.customCats.find(c=>c.name.toLowerCase()===nm.toLowerCase()); let id;
    if(ex) id=ex.id; else { id="c_"+Date.now().toString(36); const color=CUSTOM_COLORS[S.customCats.length%CUSTOM_COLORS.length]; S.customCats.push({id,name:nm,color}); CATS[id]=color; save(); toast(t("t_cat_add",{n:nm})); track("category_added",{count:S.customCats.length}); }
    const o=document.createElement("option"); o.value=id; o.textContent=nm; if(!ex) cs.insertBefore(o,cs.querySelector('option[value="__new"]')); cs.value=id; lastCat=id; nc.hidden=true; inp.value=""; });
  f.addEventListener("submit",ev=>{ ev.preventDefault(); if(cs.value==="__new") cs.value=lastCat==="__new"?"food":lastCat;
    const amt=amountOf(f.querySelector("#x-amount")); if(amt==null) return; const pf=f.querySelector("#x-payer");
    const ne={...d,name:f.querySelector("#x-name").value.trim()||catName(f.querySelector("#x-cat").value),amount:amt,date:f.querySelector("#x-date").value||iso(today()),cat:f.querySelector("#x-cat").value,payer:pf?pf.value:(d.payer||"m1"),note:(f.querySelector("#x-note").value||"").trim()};
    if(isNew) S.expenses.push(ne); else S.expenses[S.expenses.findIndex(x=>x.id===d.id)]=ne;
    save(); render(); closeSheet(); toast(isNew?t("t_exp_add",{n:ne.name}):t("t_saved")); if(isNew){ track("expense_added",{category:ne.cat,count:S.expenses.length}); maybeExPrompt(); } });
  const del=f.querySelector("#xDel");
  if(del) del.addEventListener("click",()=>{ const box=f.querySelector("#xDelBox"); box.innerHTML=`<div class="confirm"><span>${t("del_q",{n:esc(d.name)})}</span><div class="actions"><button type="button" class="btn danger" id="xYes">${t("del")}</button><button type="button" class="btn soft" id="xNo">${t("keep")}</button></div></div>`;
    box.querySelector("#xYes").onclick=()=>{ S.expenses=S.expenses.filter(x=>x.id!==d.id); save(); render(); closeSheet(); toast(t("t_del",{n:d.name})); };
    box.querySelector("#xNo").onclick=()=>{ box.innerHTML=""; }; });
}

/* ---------- profile: account, appearance, family, premium, data ---------- */
let draftPhoto;
function familyHTML(){
  const all=visible(), tot=all.reduce((a,p)=>a+monthly(p),0)||1;
  const addForm=S.members.length<4?`<form id="pfMember" novalidate style="display:grid;gap:10px"><div class="field"><label for="pf-mem">${t("add_person")}</label><input id="pf-mem" maxlength="20" placeholder="${t("ph_person")}"></div><button class="btn soft" type="submit">${t("add")}</button></form>`:"";
  if(!hasPartner()) return `<section class="card glass" style="display:grid;gap:12px"><p style="margin:0;font-size:13.5px;color:var(--ink-2)">${t("fam_empty")}</p>${addForm}</section>`;
  const ms=S.members.map(m=>{ const s=all.filter(p=>p.payer===m.id).reduce((a,p)=>a+monthly(p),0), c=all.filter(p=>p.payer===m.id).length;
    const av=m.id==="m1"&&S.profile.photo?`<span class="av"><img src="${S.profile.photo}" alt=""></span>`:`<span class="av" style="background:${memberColor(m.id)}">${esc(initials(mname(m)))}</span>`;
    return `<div class="member">${av}<div class="main"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(mname(m))}</b><span class="num" style="font-weight:700">${money(s,0)}</span></div><div style="font-size:12.5px;color:var(--ink-3)">${t("m_meta",{c,p:Math.round(s/tot*100)})}</div><div class="bar"><div style="width:${s/tot*100}%;background:${memberColor(m.id)}"></div></div></div>${m.id!=="m1"?`<button type="button" class="btn soft small" data-rm="${m.id}">${t("remove")}</button>`:""}</div>`; }).join("");
  const [a,b]=S.members, sa=all.filter(p=>p.payer===a.id).reduce((x,p)=>x+monthly(p),0), sb=all.filter(p=>p.payer===b.id).reduce((x,p)=>x+monthly(p),0), diff=(sa-sb)/2;
  const settle=Math.abs(diff)<1?t("settle_eq"):t("settle_t",{a:esc(mname(diff>0?b:a)),b:esc(mname(diff>0?a:b)),x:money(Math.abs(diff),0)});
  return `<section class="card glass"><span class="label">${t("who_pays")}</span><div class="members" style="margin-top:12px">${ms}</div></section>
  <section class="card glass" style="font-size:14.5px"><span class="label">${t("settle")}</span><p style="margin:8px 0 0">${settle}</p></section>
  ${S.premium?`<section class="card glass" style="display:grid;gap:12px"><span class="label">${t("shared")}</span><span style="font-size:13.5px;color:var(--ink-2)">${t("shared_t")}</span><div class="code" id="inviteCode">7KQ-42M</div><button type="button" class="btn soft" data-pf="copy">${t("copy")}</button><span style="font-size:12px;color:var(--ink-3)">${t("demo_sync")}</span></section>`:`<div class="locked" style="margin-top:0"><b>${t("shared_lock")}</b><span>${t("shared_lock_t")}</span></div>`}
  ${addForm?`<section class="card glass">${addForm}</section>`:""}`;
}

    <div class="field"><span style="font-size:12.5px;font-weight:600;color:var(--ink-2)">${t("theme")}</span><div class="langseg" role="group">${[["light",t("th_light")],["dark",t("th_dark")],["auto",t("th_auto")]].map(([v,l])=>`<button type="button" data-pftheme="${v}" aria-pressed="${pr.theme===v}">${l}</button>`).join("")}</div></div>
    <div class="field"><label for="pf-remind">${t("p_remind")}</label><select id="pf-remind">${REMIND_OPTS.map(v=>`<option value="${v}" ${v===pr.remind?"selected":""}>${remindLabel(v)}</option>`).join("")}</select></div>
    <section class="card glass" style="padding-block:4px">
      <div class="setrow"><div><b>${t("notif")}</b><p>${t("notif_t")}</p></div>${sw("pf-notif",pr.notif,t("notif"))}</div>
      <div class="setrow"><div><b>${t("hide")}</b><p>${t("hide_t")}</p></div>${sw("pf-hide",pr.hide,t("hide"))}</div>
    </section>
    <button class="btn primary" type="submit">${t("save")}</button>
  </form>
  <h4 class="pf-sec">${t("sec_family")}</h4>
  ${familyHTML()}
  <h4 class="pf-sec">Premium <span class="chip ${S.premium?"violet":"grey"}" style="margin-left:6px;vertical-align:middle">${S.premium?t("plan_prem"):t("plan_free",{a:Math.min(S.items.length,FREE_LIMIT),b:FREE_LIMIT})}</span></h4>
  <div class="plans"><div class="plan glass ${S.premium?"":"on"}"><span class="label">${t("free")}</span><b>0 zł</b><ul><li>${t("fi1",{n:FREE_LIMIT})}</li><li>${t("fi2")}</li><li>${t("fi3")}</li></ul></div>
    <div class="plan glass ${S.premium?"on":""}"><span class="label" style="color:var(--b)">Premium</span><b>14,99 zł</b><span style="font-size:12px;color:var(--ink-3)">${t("prem_per")}</span><ul><li>${t("pi1")}</li><li>${t("pi2")}</li><li>${t("pi3")}</li><li>${t("pi4")}</li></ul></div></div>
  <section class="card glass" style="padding-block:4px"><div class="setrow"><div><b>${t("prem_demo")}</b><p>${t("prem_demo_t")}</p></div>${sw("pf-prem",S.premium,t("prem_demo"))}</div></section>
  <h4 class="pf-sec">${t("sec_help")}</h4>
  <section class="card glass" style="padding-block:4px">
    <div class="setrow"><div><b>${t("fb")}</b><p>${t("fb_t")}</p></div><a class="btn soft small" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener" data-fb>${t("fb_open")}</a></div>
    ${isStandalone()?"":`<div class="setrow"><div><b>${t("inst_row")}</b><p>${t("inst_row_t")}</p></div><button type="button" class="btn soft small" data-pf="inst">${t("inst_show")}</button></div>`}
    ${CFG.privacyUrl?`<div class="setrow"><div><b>${t("priv")}</b><p>${t("priv_t")}</p></div><a class="btn soft small" href="${esc(CFG.privacyUrl)}" target="_blank" rel="noopener">${t("priv_open")}</a></div>`:""}
    <div class="setrow"><div><b>${t("an")}</b><p>${t("an_t")}</p></div>${sw("pf-an",S.profile.analytics!==false,t("an"))}</div>
  </section>
  <h4 class="pf-sec">${t("data")}</h4>
  <section class="card glass" style="padding-block:4px">
    <div class="setrow"><div><b>${t("rates")}</b><p>1 EUR = ${fmt(RATES.EUR)} zł · 1 USD = ${fmt(RATES.USD)} zł, ${t("approx")}</p></div></div>
    <div class="setrow"><div><b>${t("ob_replay")}</b><p>${t("ob_replay_t")}</p></div><button type="button" class="btn soft small" data-pf="onb">${t("ob_show")}</button></div>
    <div class="setrow"><div><b>${t("sample")}</b><p>${t("sample_t")}</p></div><button type="button" class="btn soft small" data-pf="reset">${t("restore")}</button></div>
    <div class="setrow"><div><b>${t("wipe")}</b><p>${t("wipe_t")}</p></div><button type="button" class="btn danger small" data-pf="wipe">${t("clear")}</button></div>
  </section><div id="pfWipe"></div>
  <p class="hint" style="margin:6px 0 0">${t("proto")}</p>
  <button type="button" class="btn soft" data-close>${t("close")}</button>`);
  const sh=root.querySelector(".sheet"); if(scroll) sh.scrollTop=scroll;
  const refresh=()=>{ const st=sh.scrollTop; keepProfileDraft(sh); save(); render(); openProfile(st); };
  sh.querySelector("#pfFile").addEventListener("change",e=>{ const file=e.target.files&&e.target.files[0]; if(!file) return;
    const rd=new FileReader(); rd.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=240, c=document.createElement("canvas"); c.width=s; c.height=s; const ctx=c.getContext("2d"); const m=Math.min(img.width,img.height); ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,s,s); draftPhoto=c.toDataURL("image/jpeg",0.85); sh.querySelector("#pfAv").innerHTML=`<img src="${draftPhoto}" alt=""><label class="pf-cam" for="pfFile" aria-label="${t("photo_change")}">${svg(UI.camera)}</label>`; };
      img.onerror=()=>toast(t("t_photo_err")); img.src=rd.result; }; rd.onerror=()=>toast(t("t_photo_err")); rd.readAsDataURL(file); });
  const del=sh.querySelector("#pfDel"); if(del) del.addEventListener("click",()=>{ draftPhoto=null; sh.querySelector("#pfAv").innerHTML=`${esc(initials(pr.name||t("you")))}<label class="pf-cam" for="pfFile" aria-label="${t("photo_change")}">${svg(UI.camera)}</label>`; del.remove(); });
  sh.querySelectorAll("[data-pftheme]").forEach(b=>b.addEventListener("click",()=>{ S.profile.theme=b.dataset.pftheme; refresh(); }));
  sh.querySelectorAll("[data-pflang]").forEach(b=>b.addEventListener("click",()=>{ S.lang=b.dataset.pflang; refresh(); }));
  sh.querySelector("#pfForm").addEventListener("submit",e=>{ e.preventDefault(); keepProfileDraft(sh); save(); render(); closeSheet(); toast(t("t_profile")); });
  const an=sh.querySelector("#pf-an"); if(an) an.addEventListener("change",()=>{ if(!an.checked) track("analytics_off"); S.profile.analytics=an.checked; save(); try{ window.cmSetAnalytics&&window.cmSetAnalytics(an.checked); }catch(e){} if(an.checked) track("analytics_on"); });
  const fbl=sh.querySelector("[data-fb]"); if(fbl) fbl.addEventListener("click",()=>track("feedback_opened"));
  const mf=sh.querySelector("#pfMember"); if(mf) mf.addEventListener("submit",e=>{ e.preventDefault(); const v=sh.querySelector("#pf-mem").value.trim(); if(!v) return; if(S.members.length>=4){ toast(t("t_max4")); return; } track("partner_added",{members:S.members.length+1}); S.members.push({id:"m"+Date.now().toString(36),name:v}); toast(t("t_person",{n:v})); refresh(); });
  sh.querySelectorAll("[data-rm]").forEach(b=>b.addEventListener("click",()=>{ const id=b.dataset.rm, nm=memberName(id); S.members=S.members.filter(m=>m.id!==id); S.items.forEach(p=>{ if(p.payer===id) p.payer="m1"; }); S.expenses.forEach(x=>{ if(x.payer===id) x.payer="m1"; }); if(S.member===id) S.member="all"; toast(t("t_del",{n:nm})); refresh(); }));
  sh.querySelector("#pf-prem").addEventListener("change",e=>{ S.premium=e.target.checked; toast(S.premium?t("t_prem_on"):t("t_prem_off",{n:FREE_LIMIT})); refresh(); });
  sh.addEventListener("click",e=>{ const b=e.target.closest("[data-pf]"); if(!b) return; const k=b.dataset.pf;
    if(k==="copy"){ const c=sh.querySelector("#inviteCode"); const sel=()=>{ const r=document.createRange(); r.selectNodeContents(c); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast(t("t_sel")); }; try{ navigator.clipboard.writeText(c.textContent).then(()=>toast(t("t_copied")),sel); }catch(err){ sel(); } }
    if(k==="inst"){ keepProfileDraft(sh); save(); closeSheet(); openInstall("profile"); return; }
    if(k==="onb"){ keepProfileDraft(sh); S.onboarded=false; obStep=0; obPicks=[]; obVals={}; save(); closeSheet(); render(); return; }
    if(k==="reset"){ keepProfileDraft(sh); S=sample(S.lang,S.profile); save(); closeSheet(); tab="home"; render(); toast(t("t_restored")); }
    if(k==="wipe") sh.querySelector("#pfWipe").innerHTML=`<div class="confirm"><span>${t("wipe_q")}</span><div class="actions"><button type="button" class="btn danger" data-pf="wipeYes">${t("del_all")}</button><button type="button" class="btn soft" data-pf="wipeNo">${t("cancel")}</button></div></div>`;
    if(k==="wipeYes"){ S.items=[]; S.expenses=[]; S.demo=false; save(); render(); closeSheet(); toast(t("t_wiped")); }
    if(k==="wipeNo") sh.querySelector("#pfWipe").innerHTML=""; });
}
function keepProfileDraft(sh){ const pr=S.profile, q=s=>sh.querySelector(s); if(!q("#pf-name")) return; pr.name=q("#pf-name").value.trim();  pr.remind=Number(q("#pf-remind").value); pr.notif=q("#pf-notif").checked; pr.hide=q("#pf-hide").checked; pr.photo=draftPhoto||null; }

["gesturestart","gesturechange","gestureend"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
render();
(function(){ const sp=document.getElementById("splash"); if(!sp) return; const t0=window.__spT0||Date.now(); let done=false;
  const hide=()=>{ if(done) return; done=true; const wait=Math.max(0,(S.onboarded?1600:2300)-(Date.now()-t0)); setTimeout(()=>{ sp.classList.add("out"); setTimeout(()=>sp.remove(),650); },wait); };
  try{ (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(hide,hide); }catch(e){ hide(); } setTimeout(hide,3000); })();
track("app_opened",{standalone:isStandalone(),platform:platform(),onboarded:!!S.onboarded,items:S.items.length,expenses:S.expenses.length,demo:!!S.demo,variant:VARIANT});
})();
</script>
<script>
if("serviceWorker" in navigator && (location.protocol==="https:"||location.hostname==="localhost")){ window.addEventListener("load",function(){ navigator.serviceWorker.register("/sw.js").catch(function(){}); }); }
</script>
</body>
</html>
